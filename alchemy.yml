app:
  - src

tests:
  engine: pest
  parallel: false
  paths:
    - tests
  files:
    - '*.test.php'
  coverage:
    local: false
    actions: true

lint:
  preset: PSR12
  rules:
    no_unused_imports: true
    single_quote: true

actions:
  run:
    - tests
  os:
    - macos-latest
    - ubuntu-latest
  php:
    extensions: json, zip, dom, curl, libxml, mbstring, pdo_sqlite
    versions:
      - '8.4'
      - '8.3'
      - '8.2'
  events:
    - push
    - pull_request
